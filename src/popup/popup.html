<!--
  @fileoverview Popup UI for the Page Adapter extension.
  Renders preset buttons and handles user input for natural language requests.
  Dependencies: popup.css, popup.js.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Adapter</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Page Adapter</h1>
        <p>Adapt the page to your needs.</p>
      </div>
    </header>

    <section class="section">
      <h2>Quick actions</h2>
      <div id="presets" class="presets"></div>
    </section>

    <section class="section">
      <label class="input-label" for="request">Or write what you need</label>
      <textarea id="request" rows="5" placeholder="E.g.: Make this page simpler and hide non-essential elements." maxlength="2000"></textarea>
      <div class="input-footer">
        <span id="counter">0 / 2000</span>
        <button id="adapt" class="primary-button" type="button">Adapt</button>
      </div>
    </section>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script type="module" src="./popup.js"></script>
</body>
</html>
