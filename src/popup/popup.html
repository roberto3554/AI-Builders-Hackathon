<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Adapter</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1 id="popup-title">Page Adapter</h1>
        <p id="popup-subtitle">Adapt the page to your needs.</p>
      </div>
    </header>

    <section class="section info-section">
      <p id="info-description">This extension allows you to adapt web pages to your needs. To use it, click the power button that appears on the page.</p>
      <p id="info-version">Version: <span id="version-number"></span></p>
    </section>
  </main>

  <script type="module" src="./popup.js"></script>
</body>
</html>
